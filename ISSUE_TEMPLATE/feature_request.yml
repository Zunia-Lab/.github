name: Feature request
description: Suggest an idea for Zunia
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - zunia-extension
        - zunia-mobile
        - zunia-dashboard
        - zunia-website
        - zunia-docs
        - zunia-chain-registry
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
